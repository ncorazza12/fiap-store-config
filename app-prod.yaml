apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: store-prod-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/ncorazza12/fiap-store-config.git'
    targetRevision: HEAD
    path: k8s/overlays/prod
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: store-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
