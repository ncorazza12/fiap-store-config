apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base
- namespace.yaml
- policies.yaml

namespace: store-prod

replicas:
- name: store-api
  count: 3
- name: store-front
  count: 3

patches:
- path: patch-prod.yaml
  target:
    kind: Deployment
    name: store-api
