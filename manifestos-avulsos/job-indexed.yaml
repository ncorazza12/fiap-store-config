apiVersion: batch/v1
kind: Job
metadata:
  name: processa-pedidos-indexed
  namespace: store-dev
spec:
  completions: 4
  parallelism: 2
  completionMode: Indexed
  template:
    spec:
      containers:
      - name: worker
        image: busybox
        command: ["/bin/sh", "-c"]
        args:
          - "echo Particao processada: $JOB_COMPLETION_INDEX"
        resources:
          requests:
            cpu: "20m"
            memory: "32Mi"
          limits:
            cpu: "100m"
            memory: "64Mi"
      restartPolicy: Never
