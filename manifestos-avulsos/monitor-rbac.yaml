apiVersion: v1
kind: ServiceAccount
metadata:
  name: monitor-sa
  namespace: store-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: store-dev
  name: leitura-store
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints", "configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: monitor-binding
  namespace: store-dev
subjects:
- kind: ServiceAccount
  name: monitor-sa
  namespace: store-dev
roleRef:
  kind: Role
  name: leitura-store
  apiGroup: rbac.authorization.k8s.io
