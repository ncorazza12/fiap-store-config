apiVersion: batch/v1
kind: CronJob
metadata:
  name: sincroniza-catalogo
  namespace: store-dev
spec:
  schedule: "*/5 * * * *"
  timeZone: "America/Sao_Paulo"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: worker
            image: busybox
            command: ["/bin/sh", "-c"]
            args: ["sleep 360"]
            env:
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: catalogo-secret
                  key: API_TOKEN
            volumeMounts:
            - name: token-vol
              mountPath: /etc/catalogo
              readOnly: true
            resources:
              requests:
                cpu: "10m"
                memory: "16Mi"
              limits:
                cpu: "50m"
                memory: "32Mi"
          volumes:
          - name: token-vol
            secret:
              secretName: catalogo-secret
              defaultMode: 0400
          restartPolicy: Never
