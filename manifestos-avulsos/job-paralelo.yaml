apiVersion: batch/v1
kind: Job
metadata:
  name: processa-pedidos
  namespace: store-dev
spec:
  completions: 10
  parallelism: 3
  backoffLimit: 4
  ttlSecondsAfterFinished: 600
  template:
    spec:
      containers:
      - name: worker
        image: busybox
        command: ["/bin/sh", "-c"]
        args:
          - "echo Hostname: $HOSTNAME && sleep $(( (RANDOM % 6) + 3 )) && echo LOTE OK $HOSTNAME"
        resources:
          requests:
            cpu: "20m"
            memory: "32Mi"
          limits:
            cpu: "100m"
            memory: "64Mi"
      restartPolicy: Never
