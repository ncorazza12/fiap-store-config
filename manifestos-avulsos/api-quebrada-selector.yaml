apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-api
  namespace: store-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: store-api
  template:
    metadata:
      labels:
        app: store-api
    spec:
      containers:
      - name: api
        image: nginx:alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "10m"
            memory: "16Mi"
          limits:
            cpu: "50m"
            memory: "32Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: store-api-svc
  namespace: store-dev
spec:
  selector:
    app: storeapi  # ERRO INTENCIONAL: faltando o hífen
  ports:
  - port: 80
    targetPort: 80
