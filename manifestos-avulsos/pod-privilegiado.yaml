apiVersion: v1
kind: Pod
metadata:
  name: pod-privilegiado
spec:
  containers:
  - name: hacker
    image: busybox
    command: ["sleep", "3600"]
    securityContext:
      privileged: true
    resources:
      requests:
        cpu: "10m"
        memory: "16Mi"
      limits:
        cpu: "50m"
        memory: "32Mi"
